# Sparse dry-run fixture: the current-truth check proves the work item is already
# implementation-ready, so planning and investigation stay skipped. Run with
# --default-stubs.
triage__triage:
  route: deliver
  summary: "stub: current code confirms a complete work order"
gate-direct: '{"gate":"direct"}'
deliver__impl__implement:
  done: true
  green: true
  summary: "stub: direct work implemented and green"
deliver__review__synthesize:
  ready: true
  findings_summary: "stub: no open findings"
deliver__validate__validate:
  green: true
  summary: "stub: project gate green"
outcome: "https://github.com/example/repo/pull/4"
ci-probe: '{"state":"concluded","detail":"all checks green"}'
deliver__classify:
  tests: false
  errors: false
  comments: false
  types: false
  docs: false
  reasons:
    tests: "stub: small fixture diff"
    errors: "stub: no failure paths"
    comments: "stub: no comment changes"
    types: "stub: no contract changes"
    docs: "stub: no doc-facing changes"
deliver__resolve-scope: '{"tests":"false","errors":"false","comments":"false","types":"false","docs":"false"}'
