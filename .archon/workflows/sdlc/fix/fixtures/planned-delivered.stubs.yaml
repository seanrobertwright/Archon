# Sparse dry-run fixture: triage finds a design decision, the resulting plan is
# ready, and the shared delivery tail completes. Run with --default-stubs.
triage__triage:
  route: plan
  summary: "stub: desired outcome is current; implementation shape needs a decision"
planned__plan:
  ready: true
  summary: "stub: approach chosen and plan ready"
deliver__impl__implement:
  done: true
  green: true
  summary: "stub: planned work implemented and green"
deliver__review__synthesize:
  ready: true
  findings_summary: "stub: no open findings"
deliver__validate__validate:
  green: true
  summary: "stub: project gate green"
outcome: "https://github.com/example/repo/pull/3"
ci-probe: '{"state":"concluded","detail":"all checks green"}'
deliver__classify:
  tests: false
  errors: false
  comments: false
  types: false
  docs: false
  reasons:
    tests: "stub: small fixture diff"
    errors: "stub: no failure paths"
    comments: "stub: no comment changes"
    types: "stub: no contract changes"
    docs: "stub: no doc-facing changes"
deliver__resolve-scope: '{"tests":"false","errors":"false","comments":"false","types":"false","docs":"false"}'
