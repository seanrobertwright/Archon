name: archon-deliver
description: |
  The delivery tail, end to end and autonomous: implement the work, gate on
  green, open a draft PR, review it, correct and close the findings, validate,
  wait for checks to clear, then flip the PR ready for review. No in-run
  approval gate — the human gate is PR review and merge on GitHub, outside
  the run.

  Use when: decided work should become a reviewed, ready-to-merge PR —
  "deliver this plan", "take this to a PR", "build and ship this".
  NOT for: deciding what to build, or merging (always human).

# Review establishes the first verdict. When blockers remain, a bounded static
# body repeats fix → light review, so every correction is independently checked
# and a clean review stops immediately. Exhausting the bound fails truthfully
# with the PR still draft and the canonical report carrying the open findings.

requires: [github]

inputs:
  work:
    default: ""
    description: >-
      What to deliver — a plan path, findings, or a description. Empty means
      the run's trigger message is the work.
  prior_report:
    default: ""
    description: >-
      Cross-run review continuity: the previous delivery run's review report
      path. Round 1 then verifies prior findings (rejections included) instead
      of relitigating them from scratch. Empty on a first delivery.
  # Error review can be forced on or off. Code, seams, simplify, and tests always run;
  # docs runs only when the classifier finds shipped documentation in the diff.
  errors:
    default: "auto"
    description: Silent-failure lens — auto, true, or false.

returns: pr

nodes:
  - id: impl
    include: archon-implement
    with:
      work: "$INPUTS.work"

  # R3's gate: run success never certifies green — this does, deterministically,
  # before anything public happens. Strict field access: a missing field fails
  # the node rather than passing the gate. It fails on red the change introduced
  # and passes red the change cannot have caused, recording that caveat for every
  # downstream reader — see scripts/gate-green.py for why that trade is safe.
  - id: gate-green
    script: gate-green
    runtime: uv
    depends_on: [impl]
    with:
      green: "$impl.output.green"
      red_cause: "$impl.output.red_cause"
      summary: "$impl.output.summary"
      stage: "The implementation"

  - id: pr
    include: archon-pr
    with:
      draft: "true"
    depends_on: [gate-green]

  # Initial review: full on a first delivery, light continuation when
  # the caller passes the previous run's report (adjudications carry across
  # runs instead of being relitigated).
  # Review scope is decided from the actual PR, not declared blind at launch:
  # the diff is information that does not exist until the PR does. classify
  # judges whether errors and docs warrant their conditional lenses; resolve-scope
  # then merges the operator's declared error override over that judgment. Its
  # output feeds the errors gate, while the classifier feeds the docs gate. Round
  # 1 decides once,
  # and correction reviews preserve those concerns while one continuation
  # reviewer judges the prior report and correction delta.
  - id: classify
    command: classify-review-scope
    depends_on: [pr]
    mutates_checkout: false
    output_type: review-scope
    output_format:
      type: object
      properties:
        errors: { type: boolean }
        docs: { type: boolean }
        reasons:
          type: object
          properties:
            errors: { type: string }
            docs: { type: string }
          required: [errors, docs]
      required: [errors, docs, reasons]

  # Deterministic merge at the boundary: a declared 'true'/'false' beats the
  # classifier; 'auto' adopts its judgment. Output values are the strings the
  # lens gates compare against.
  - id: resolve-scope
    script: resolve-review-scope
    runtime: uv
    with:
      c_errors: "$classify.output.errors"
    depends_on: [classify]

  - id: review
    include: archon-review
    with:
      # The PR node's structured read-back is the target authority. Review must
      # not rediscover an ambient branch→PR mapping.
      scope: "$pr.output.number"
      prior_report: "$INPUTS.prior_report"
      work_order: "$INPUTS.work"
      errors: "$resolve-scope.output.errors"
      docs: "$classify.output.docs"
    depends_on: [resolve-scope]

  # Validate the authored verdict before it controls a costly branch. `ready`
  # remains the review outcome; `action` says what delivery may do about it.
  - id: review-action
    script: validate-review-action
    runtime: uv
    with:
      ready: "$review.output.ready"
      action: "$review.output.action"
    depends_on: [review]

  # A ready initial review skips this block. Otherwise each iteration corrects
  # the current canonical findings, proves the correction is green, then runs a
  # fresh continuation review over the report and delta, never an unreviewed
  # final fix. The bound
  # is a runaway backstop, not a pacing device: until_bash ends the loop the
  # moment a recheck certifies ready, so a healthy fix-class run still exits in
  # one or two rounds. Five rounds is calibrated to the feature-class evidence
  # (2026-08-25: every executor-heavy delivery needed 4-6 rounds and every
  # non-starved resume converged; 3 cut two converging runs short). A per-lane
  # bound would need runtime-parameterized composition, which the language
  # deliberately does not have — the flat bound buys the same outcome free.
  - id: corrections
    depends_on: [review-action]
    when: "$review-action.output.action == 'correct'"
    loop_group:
      # `none` converged and `replan` must stop correction. gate-ready below
      # accepts only `none`; a replan outcome leaves the PR draft and fails with
      # the canonical report intact instead of spending another correction.
      until_bash: test $recheck-action.output.action != "correct"
      max_iterations: 5
      fresh_context: true
      nodes:
        - id: fix
          include: archon-implement
          with:
            work: >-
              Fix every open Critical and Important finding recorded in
              $ARTIFACTS_DIR/review/report.md, within the accepted work order
              below. Read both in full before editing. When a causal finding
              records a finite affected-member inventory, the finding is not
              fixed until every affected member is handled and the smallest
              relevant proof passes. Do not cross an explicit boundary to make
              a finding disappear; the following review must return replan if
              the requested outcome requires that expansion.

              Accepted work order:
              $INPUTS.work

              When the correction is green, push its commits to the existing PR
              branch. Before pushing, read PR #$pr.output.number from the origin
              repository and fail unless its head is exactly
              $pr.output.head and the current branch is that same name. Push that
              recorded branch explicitly; do not let git select an upstream or
              gh resolve a PR from ambient state. Do not change the PR's draft state or edit the
              canonical review comment; the following review owns that public
              verdict. Record the exact push target and a read-back of the remote
              ref in implementation.md; never record credentials.

        # The same gate, same script: a correction can hit inherited or environment
        # red exactly as the first implementation can (run 49f0d462, #2939), and a
        # correction refused for a red it did not cause wastes the whole round.
        - id: gate-correction-green
          script: gate-green
          runtime: uv
          depends_on: [fix]
          with:
            green: "$fix.output.green"
            red_cause: "$fix.output.red_cause"
            summary: "$fix.output.summary"
            stage: "The correction"

        - id: recheck
          include: archon-review
          with:
            scope: ""
            prior_report: "$ARTIFACTS_DIR/review/report.md"
            work_order: "$INPUTS.work"
            # Continuation mode owns coverage and skips every specialist,
            # regardless of these conditional-lens bindings.
            errors: "$resolve-scope.output.errors"
            docs: "$classify.output.docs"
          depends_on: [gate-correction-green]

        - id: recheck-action
          script: validate-review-action
          runtime: uv
          with:
            ready: "$recheck.output.ready"
            action: "$recheck.output.action"
          depends_on: [recheck]

  # none_failed_min_one_success joins the mutually exclusive paths as bound
  # values (#2637): the
  # initial review's verdict directly, and the correction loop's final verdict
  # with if_skipped defaults. The loop can stop on `none` (ready) or `replan`
  # (truthful terminal refusal); the script below owns that final distinction.
  # A failed loop (bound exhausted) or failed review prevents this node from
  # running, so lifecycle success alone never certifies readiness. if_skipped
  # covers only skipped/pending producers, never failed ones.
  - id: gate-ready
    script: gate-ready
    runtime: uv
    depends_on: [review-action, corrections]
    trigger_rule: none_failed_min_one_success
    with:
      review_ready: { from: "$review-action.output.ready", if_skipped: false }
      review_action: { from: "$review-action.output.action", if_skipped: null }
      correction_ready: { from: "$corrections.output.ready", if_skipped: false }
      correction_action: { from: "$corrections.output.action", if_skipped: null }

  # Correction rounds change the diff after `pr` wrote the description, so
  # concrete claims in the body can be falsified by the very fixes the review
  # demanded. One resync, once readiness is certified — never per iteration
  # (that would be repeated public writes describing diffs the next iteration
  # falsifies). Skipped when the initial review was already ready: the diff
  # never changed after the body was written.
  - id: sync-pr-body
    command: sync-pr-body
    model: medium
    with:
      pr_number: "$pr.output.number"
      pr_head: "$pr.output.head"
    depends_on: [gate-ready]
    when: "$review.output.ready == 'false'"

  # Final local gate, ALWAYS run: the project's own checks via the validate
  # package. Uniform on every path — and when CI is maintainer-gated (fork
  # PRs), this is the only validation before the flip.
  - id: validate
    include: archon-validate
    depends_on: [gate-ready]

  # The third gate on the same script, for the same reason: a local gate that
  # refuses every red refuses red the change did not cause, and the base break
  # this branch inherited is exactly the red that survives to here. Introduced red
  # still stops the run. Inherited or environment red proceeds to await-checks,
  # where the pull request's own CI decides — an inherited break is red there too
  # and holds at the durable wait, which is the honest place to hold it.
  - id: gate-validated
    script: gate-green
    runtime: uv
    depends_on: [validate]
    with:
      green: "$validate.output.green"
      red_cause: "$validate.output.red_cause"
      summary: "$validate.output.summary"
      stage: "The project gate"

  # CI wait, durably. The probe classifies check state once; a pending state
  # routes into the engine's `wait:` node (#2744), which suspends the run and
  # releases the worker slot — the server's continuation scan resumes it when
  # the clock fires, surviving restarts. This replaced a 60-minute in-process
  # polling script the moment the engine could hold the time itself. Red fails
  # the body (and so the group) immediately; a concluded probe skips the pause
  # and `until_bash` ends the loop with zero wasted wait. 13 iterations bound
  # the watch at ~60 minutes of CI time, the same ceiling the poller had —
  # exhausting it fails the run rather than flipping a PR whose CI never ended.
  - id: await-checks
    loop_group:
      max_iterations: 13
      # Completion computed EXTERNALLY (gh state), never from body-node output
      # substitution: the resumed-wait completion recheck does not evaluate
      # until_bash against the iteration's outputs (#2794 — seen flipping a PR
      # with CI still running). Red counts as done here; the next iteration's
      # probe is what turns red into a loud body failure, and flip-ready's
      # preflight refuses any non-green state that slips through regardless.
      until_bash: '! gh pr checks --json bucket --jq ".[].bucket" 2>/dev/null | grep -q "^pending$"'
      nodes:
        - id: ci-probe
          script: check-ci
          runtime: uv
          # The probe's only in-process wait is the single 60 s registration
          # grace; headroom over the 120 s script default keeps that honest.
          timeout: 180000
        - id: ci-pause
          wait:
            duration_ms: 300000
          when: $ci-probe.output.state == 'pending'
          depends_on: [ci-probe]
    depends_on: [gate-validated]

  - id: flip-ready
    bash: |
      set -euo pipefail
      EVIDENCE="$ARTIFACTS_DIR/flip-ready.log"
      : > "$EVIDENCE"
      record() {
        printf '$' >> "$EVIDENCE"
        printf ' %q' "$@" >> "$EVIDENCE"
        printf '\n' >> "$EVIDENCE"
        "$@" >> "$EVIDENCE" 2>&1
      }
      record_read() {
        printf '$' >> "$EVIDENCE"
        printf ' %q' "$@" >> "$EVIDENCE"
        printf '\n' >> "$EVIDENCE"
        "$@" 2>&1 | tee -a "$EVIDENCE"
      }
      fail() {
        printf '%s\n' "$1" | tee -a "$EVIDENCE" >&2
        exit 1
      }
      # --repo pins to the origin remote (#2226): gh's default resolution in a
      # fork clone targets the upstream parent instead. With --repo, gh disables
      # branch inference and REQUIRES an explicit selector — omitting it is a
      # usage error, seen red on run 925f6c43's resume.
      ORIGIN_REPO=$(record_read git remote get-url origin | sed -E 's#^.*[:/]([^/]+/[^/]+)$#\1#; s#\.git$##')
      PR_NUMBER=$pr.output.number
      EXPECTED_BRANCH=$pr.output.head
      BRANCH=$(record_read git branch --show-current)
      if [ -z "$BRANCH" ]; then
        fail "flip-ready: detached HEAD — cannot resolve the PR branch."
      fi
      if [ "$BRANCH" != "$EXPECTED_BRANCH" ]; then
        fail "flip-ready: current branch '$BRANCH' does not match run-owned PR #$PR_NUMBER branch '$EXPECTED_BRANCH'."
      fi
      ACTUAL_BRANCH=$(record_read gh pr view "$PR_NUMBER" --repo "$ORIGIN_REPO" --json headRefName --jq .headRefName)
      if [ "$ACTUAL_BRANCH" != "$EXPECTED_BRANCH" ]; then
        fail "flip-ready: PR #$PR_NUMBER head '$ACTUAL_BRANCH' does not match recorded branch '$EXPECTED_BRANCH'."
      fi
      # Public-surface preflight (#2794): the flip is the one irreversible
      # step, so it re-verifies CI itself instead of trusting the loop above —
      # any pending or non-green check refuses the flip loudly. An empty result
      # (no CI configured, or gated checks that never started) proceeds,
      # matching the probe's permission-agnostic skip.
      NOT_GREEN=$(record_read gh pr checks "$PR_NUMBER" --repo "$ORIGIN_REPO" --json name,bucket --jq '.[] | select(.bucket != "pass" and .bucket != "skipping") | "\(.name) (\(.bucket))"')
      if [ -n "$NOT_GREEN" ]; then
        fail "flip-ready: refusing to flip with non-green checks: $NOT_GREEN"
      fi
      record gh pr ready "$PR_NUMBER" --repo "$ORIGIN_REPO"
      draft=$(record_read gh pr view "$PR_NUMBER" --repo "$ORIGIN_REPO" --json isDraft --jq .isDraft)
      if [ "$draft" = "false" ]; then
        record_read gh pr view "$PR_NUMBER" --repo "$ORIGIN_REPO" --json url --jq .url
      else
        fail "flip-ready: PR still reports draft after the ready flip"
      fi
    # Waits on sync-pr-body explicitly: on a repo with no CI, await-checks
    # returns immediately and the flip could otherwise beat the resync. The
    # trigger rule lets a SKIPPED resync (initial review was ready) pass while
    # a FAILED resync still blocks the flip — a public surface we could not
    # correct is a reason not to go ready.
    depends_on: [await-checks, sync-pr-body]
    trigger_rule: none_failed_min_one_success
    # The node's stdout is the verified URL; the engine writes it as a durable
    # typed sidecar alongside the PR record and review report.
    output_type: public-action

  # This tail's terminal report, like every other SDLC tail's (scripts/outcome.py).
  # flip-ready owns the one irreversible public action and stops there; composing
  # the text its reader receives is separate work, and a named script keeps it out
  # of a bash body that would otherwise need a python interpreter Windows hosts do
  # not reliably have.
  - id: outcome
    script: outcome
    runtime: uv
    with:
      pr_url: "$flip-ready.output"
    depends_on: [flip-ready]
